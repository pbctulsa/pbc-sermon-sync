name: YouTube Sermon Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview missing sermons without creating episodes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publish:
        description: "Publish new episodes immediately to Church Center"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sync_podcast_audio:
        description: "Create and attach podcast audio from each YouTube sermon"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      audio_backfill_all_playlist:
        description: "Find missing audio for all matching playlist episodes, including before the sync boundary"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sync_after_video_id:
        description: "Only sync videos added after this YouTube video ID"
        required: true
        default: "uZGwiTyVMUU"
        type: string
      max_episodes_per_run:
        description: "Safety limit (increase deliberately for the first backfill)"
        required: true
        default: "10"
        type: string
      force_thumbnail_backfill:
        description: "Replace existing episode artwork with YouTube thumbnails"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      thumbnail_episode_id_min:
        description: "Optional minimum Planning Center episode ID for thumbnail backfill"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 14 * * *"

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SERMON_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      PC_CLIENTID: ${{ secrets.PC_CLIENTID }}
      PC_SECRET: ${{ secrets.PC_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_PLAYLIST_ID: PL55zozglajy_Nw-rQ-ydZeRjn1kyKnj8z
      PC_SERMON_CHANNEL_ID: "23566"
      SYNC_AFTER_VIDEO_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_after_video_id || 'uZGwiTyVMUU' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      PUBLISH_EPISODES: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'true' }}
      SYNC_PODCAST_AUDIO: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_podcast_audio || 'true' }}
      AUDIO_BACKFILL_ALL_PLAYLIST: ${{ github.event_name == 'workflow_dispatch' && inputs.audio_backfill_all_playlist || 'false' }}
      MAX_EPISODES_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_episodes_per_run || '10' }}
      EXCLUDED_TITLES: Sunday Service
      FORCE_THUMBNAIL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_thumbnail_backfill || 'false' }}
      THUMBNAIL_EPISODE_ID_MIN: ${{ github.event_name == 'workflow_dispatch' && inputs.thumbnail_episode_id_min || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Python for podcast audio
        if: env.SYNC_PODCAST_AUDIO == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install podcast audio tools
        if: env.SYNC_PODCAST_AUDIO == 'true'
        run: python -m pip install --disable-pip-version-check "yt-dlp==2026.8.19"
      - name: Install dependencies
        run: npm ci
      - name: Sync YouTube sermons
        run: npm run sync
